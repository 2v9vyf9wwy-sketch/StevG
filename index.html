<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mission</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    .level { display: none; }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>🔐 Deine Mission</h1>

<!-- LEVEL 1 -->
<div id="level1">
  <p>Die Quersumme aus dem Datum, an dem dein Handy zwei grüne Punkte bekommen hat</p>
  <input type="text" id="input1" placeholder="Antwort">
  <br>
  <button onclick="check1()">Weiter</button>
</div>

<!-- LEVEL 2 -->
<div id="level2" class="level">
  <p>Welche Zutat kommt immer in meinen Döner?</p>
  <input type="text" id="input2" placeholder="Antwort">
  <br>
  <button onclick="check2()">Weiter</button>
</div>

<!-- LEVEL 3 -->
<div id="level3" class="level">
  <p>Wie viel MB an Daten haben wir bisher in WhatsApp gegenseitig versendet?</p>
  <input type="text" id="input3" placeholder="Antwort">
  <br>
  <button onclick="check3()">Weiter</button>
</div>

<!-- FINAL -->
<div id="final" class="level">
  <h2>🎉 Geschafft!</h2>
  <p>Dein Gutscheincode:</p>
  <h1>FORIVO-1234</h1>
  <p>Stark gemacht, ud HS 😄</p>
</div>

<script>
  function check1() {
    if (document.getElementById("input1").value === "17") { // ändern
      document.getElementById("level1").style.display = "none";
      document.getElementById("level2").style.display = "block";
    } else {
      alert("Falsch, du Idiot");
    }
  }

  function check2() {
    if (document.getElementById("input2").value.toLowerCase() === "Käse") { // ändern
      document.getElementById("level2").style.display = "none";
      document.getElementById("level3").style.display = "block";
    } else {
      alert("Auch falsch, HS");
    }
  }

  function check3() {
    if (document.getElementById("input3").value === "1,6") { // ändern
      document.getElementById("level3").style.display = "none";
      document.getElementById("final").style.display = "block";
    } else {
      alert("Streng dich mal an...");
    }
  }
</script>

</body>
</html>
